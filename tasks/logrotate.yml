---

- name: Ensure logrotate package is present
  ansible.builtin.package:
    name: logrotate
    state: present
  register: pkg_result
  until: pkg_result is success

- name: Add logrotate configuration for sysmon log
  ansible.builtin.template:
    src: logrotate-sysmon.j2
    dest: /etc/logrotate.d/sysmon
    mode: '0644'
    backup: yes

- name: Global logrotate configuration validation
  ansible.builtin.command:
    cmd: logrotate -dv /etc/logrotate.conf
  changed_when: false
